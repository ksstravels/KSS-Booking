    * {
        margin: 0;
        padding: 0;

    body {
        font-family: 'DM Sans', sans-serif;
        background: linear-gradient(135deg, var(--sand) 0%, var(--ivory) 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        position: relative;
        overflow-x: hidden;
    }

    body::before {
        content: '';
        position: fixed;
        top: -50%;
        right: -20%;
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, rgba(198, 123, 92, 0.08) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
        animation: float 20s ease-in-out infinite;
    }

    body::after {
        content: '';
        position: fixed;
        bottom: -30%;
        left: -10%;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(26, 77, 77, 0.05) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
        animation: float 25s ease-in-out infinite reverse;
    }

    @keyframes float {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-30px, 30px); }
    }

    .container {
        max-width: 900px;
        width: 100%;
        background: var(--ivory);
        border-radius: 4px;
        box-shadow: 
            0 20px 60px rgba(0, 0, 0, 0.08),
            0 2px 8px rgba(0, 0, 0, 0.04);
        overflow: hidden;
        position: relative;
        z-index: 1;
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(40px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .header {
        background: linear-gradient(135deg, var(--deep-teal) 0%, var(--forest) 100%);
        padding: 4rem 3rem 3rem;
        position: relative;
        overflow: hidden;
    }

    .header::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: 
            linear-gradient(45deg, transparent 48%, rgba(255, 255, 255, 0.02) 49%, rgba(255, 255, 255, 0.02) 51%, transparent 52%),
            linear-gradient(-45deg, transparent 48%, rgba(255, 255, 255, 0.02) 49%, rgba(255, 255, 255, 0.02) 51%, transparent 52%);
        background-size: 30px 30px;
        opacity: 0.3;
    }

    .header-content {
        position: relative;
        z-index: 2;
    }

    .logo {
        font-family: 'Playfair Display', serif;
        font-size: 2.5rem;

        color: var(--ivory);

        animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s backwards;
    }

    .tagline {
        font-size: 1.125rem;

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

    }

    .form-content {
        padding: 3rem;

    .section-title {

    .section-title::before {

    .form-grid {

    .form-group {

    label {

    .submit-section {
        margin-top: 3rem;

    .price-info {
        font-family: 'Playfair Display', serif;
    }

    .price-label {
        font-size: 0.875rem;

    }

    .price {
        font-size: 2rem;

        color: var(--deep-teal);
    }

    .submit-btn {
        padding: 1.125rem 3rem;
        background: linear-gradient(135deg, var(--terracotta) 0%, #B8674C 100%);
        color: white;
        border: none;
        border-radius: 2px;
        font-family: 'DM Sans', sans-serif;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);

        position: relative;
        overflow: hidden;
    }

    .submit-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
    }

    .submit-btn:hover::before {
        left: 100%;
    }

    .submit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(198, 123, 92, 0.4);
    }

    .submit-btn:active {
        transform: translateY(-1px);

        background: linear-gradient(to right, transparent, var(--sand), transparent);
    }

    @media (max-width: 768px) {
        .form-grid {
            grid-template-columns: 1fr;
        }

        .header {
            padding: 3rem 2rem 2rem;
        }

        }

        }
    }

    /* Additional decorative elements */
    .accent-dot {

        }
    }

    .success-message.show {
        display: block;
    }

    .success-message p {
        color: var(--forest);
        font-weight: 500;
    }

<script>
    // Show/hide custom destination field
    document.getElementById('destination').addEventListener('change', function() {
        const otherDestinationGroup = document.getElementById('otherDestinationGroup');
        const otherDestinationInput = document.getElementById('otherDestination');
        
        if (this.value === 'other') {
            otherDestinationGroup.style.display = 'flex';
            otherDestinationInput.required = true;
        } else {
            otherDestinationGroup.style.display = 'none';
            otherDestinationInput.required = false;
            otherDestinationInput.value = '';
        }
    });

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Collect form data
        const destinationSelect = document.getElementById('destination');
        let destinationText = destinationSelect.options[destinationSelect.selectedIndex].text;
        
        // If "Other" is selected, use the custom destination
        if (destinationSelect.value === 'other') {
            destinationText = document.getElementById('otherDestination').value;
        }
        
        const formData = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            destination: destinationText,
            travelers: document.getElementById('travelers').value,
            checkIn: document.getElementById('checkIn').value,
            checkOut: document.getElementById('checkOut').value,
            specialRequests: document.getElementById('specialRequests').value
        };
        
        // Get selected preferences
        const preferences = [];
        document.querySelectorAll('input[name="preferences"]:checked').forEach(checkbox => {
            preferences.push(checkbox.nextElementSibling.textContent);
        });
        
        // Create WhatsApp message
        let message = `*New Travel Booking Request*\n\n`;
        message += `*Personal Details:*\n`;
        message += `Name: ${formData.firstName} ${formData.lastName}\n`;
        message += `Email: ${formData.email}\n`;
        message += `Phone: ${formData.phone}\n\n`;
        message += `*Trip Details:*\n`;
        message += `Destination: ${formData.destination}\n`;
        message += `Travelers: ${formData.travelers} People\n`;
        message += `Check-in: ${formData.checkIn}\n`;
        message += `Check-out: ${formData.checkOut}\n`;
        
        if (preferences.length > 0) {
            message += `Preferences: ${preferences.join(', ')}\n`;
        }
        
        if (formData.specialRequests) {
            message += `\n*Special Requests:*\n${formData.specialRequests}`;
        }
        
        // Encode message for URL
        const encodedMessage = encodeURIComponent(message);
        
        // WhatsApp number (remove + and spaces)
        const whatsappNumber = '919562420098';
        
        // Create WhatsApp URL
        const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
        
        // Show success message
        const successMessage = document.getElementById('successMessage');
        successMessage.classList.add('show');
        
        // Scroll to success message
        successMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        
        // Open WhatsApp after a short delay
        setTimeout(() => {
            window.open(whatsappURL, '_blank');
        }, 1000);
        
        // Reset form after 3 seconds
        setTimeout(() => {
            this.reset();
            document.getElementById('otherDestinationGroup').style.display = 'none';
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 5000);
        }, 3000);
    });

    // Set minimum date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('checkIn').setAttribute('min', today);
    document.getElementById('checkOut').setAttribute('min', today);

    // Update checkout minimum when checkin changes
    document.getElementById('checkIn').addEventListener('change', function() {
        document.getElementById('checkOut').setAttribute('min', this.value);
    });

    // Add staggered animation to form groups
    const formGroups = document.querySelectorAll('.form-group');
    formGroups.forEach((group, index) => {
        group.style.animation = `fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) ${0.1 * index}s backwards`;
    });
</script>
